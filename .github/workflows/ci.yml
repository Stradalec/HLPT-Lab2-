name: CI

on:
  pull_request:
    branches: ["main", "dev-database"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build
        run: bash scripts/build.sh

      # TODO: переписать unit-тесты под новую архитектуру.
      #- name: Run unit tests
      #  run: bash scripts/unit-test.sh

      - name: Run app tests
        run: bash scripts/app-test.sh

      #- name: SonarCloud Scan
      #  uses: SonarSource/sonarcloud-github-action@master
      #  env:
      #    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #    SONAR_HOST_URL: https://sonarcloud.io

      - name: Notify Telegram (success)
        if: success()
        run: |
          curl -s \
            -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="CI УСПЕХ PR #${{ github.event.pull_request.number }} (%0Arepo: ${{ github.repository }}%0Acommit: ${{ github.sha }})"

      - name: Notify Telegram (failure)
        if: failure()
        run: |
          curl -s \
            -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="CI ОШИБКА PR #${{ github.event.pull_request.number }} (%0Arepo: ${{ github.repository }}%0Acommit: ${{ github.sha }})"
